apis:
- aid: hundredx:hundredx-mcp
  name: HundredX MCP Servers
  description: >-
    Two HundredX-operated Model Context Protocol servers reachable on the public internet —
    "HX BigQuery MCP Server" 2.0.0 at hx-bigquery-mcp.hundredx.com and "Jupyter MCP Server"
    2.0.0 at jupyter-mcp.hundredx.com. Both publish standards-compliant OAuth 2.1 discovery
    (RFC 9728 protected-resource metadata, RFC 8414 authorization-server metadata, RFC 7591
    dynamic client registration, PKCE S256) and both return 401 invalid_token to an anonymous
    tools/list. These are HundredX's own internal analyst tooling over its BigQuery warehouse
    and notebooks — Google-federated scopes bigquery.readonly and cloud-platform — not a
    customer-facing agent product. HundredX publishes no documentation for them.
