aid: hundredx
name: HundredX
description: >-
  HundredX is a Dallas/Addison, Texas data and insights company founded in 2012 that measures
  customer experience at scale and links it to future business performance. Its "data for good"
  model collects double-blind, ethically sourced feedback through HundredX Causes programs —
  contributing funding to nonprofits for every qualifying response — and has accumulated tens of
  millions of pieces of first-party consumer feedback across 80+ industries covering roughly
  two-thirds of the US economy. The company packages that corpus as the HundredX GO Score
  (Growth Outlook), a leading indicator of revenue growth and market performance 6-12 months
  ahead, and licenses it to enterprises, institutional investors and AI platforms through a
  sales-led motion and partner alliances with Deloitte and Goldman Sachs. HundredX operates no
  public developer program: delivery is through a customer portal, negotiated data feeds and
  partner channels, and no API documentation, OpenAPI description or pricing is published.
